  <polygon class="cell" points="6.20,12.23 10.35,14.63 10.35,19.42 6.20,21.82 2.05,19.42 2.05,14.63" stroke-width="0.5" stroke-linejoin="round"/>
  <polygon class="cell" points="17.80,12.23 21.95,14.63 21.95,19.42 17.80,21.82 13.65,19.42 13.65,14.63" stroke-width="0.5" stroke-linejoin="round"/>
