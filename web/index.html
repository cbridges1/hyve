<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>hyve console</title>
    <script>
      // Applied synchronously, before first paint, so there's no flash of
      // the wrong theme while React boots — src/lib/themeStore.ts re-derives
      // and keeps this in sync afterward (including live OS-preference
      // changes while a 'system' preference is active).
      (function () {
        var stored = localStorage.getItem('hyve-theme')
        var theme = stored === 'light' || stored === 'dark' ? stored : 'system'
        var dark = theme === 'dark' || (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.classList.toggle('dark', dark)
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
