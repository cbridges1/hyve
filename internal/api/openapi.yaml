openapi: 3.0.3
info:
  title: hyve API
  description: |
    hyve's HTTP API + auth layer — see HYVE-CONTROLLER-ARCHITECTURE-PLAN.md's
    Phase 6. A thin, authorized front door onto the ClusterDefinition/
    Template/Workflow/Module/HyveAccessBinding CRDs the controller already
    reconciles — cluster mode never requires this API, plain kubectl
    against the CRDs always works.

    Everything under /api/* requires a session: log in via /auth/login,
    then send the returned accessToken as `Authorization: Bearer
    <accessToken>` on every subsequent request. accessToken is short-lived
    (see AccessTokenTTL) — exchange sessionToken for a new one via
    /auth/refresh as needed, without re-authenticating with a
    username/password. A session is revocable server-side (backed by a
    HyveSession object) via /auth/logout — unlike accessToken, which is a
    stateless signed value that can't be invalidated early.
  version: "0.1.0"
servers:
  - url: /
security:
  - bearerAuth: []
tags:
  - name: auth
  - name: clusters
  - name: templates
  - name: workflows
  - name: modules
  - name: secrets
  - name: kubeconfig
paths:
  /healthz:
    get:
      tags: [auth]
      summary: Liveness/readiness probe
      security: []
      responses:
        "200":
          description: OK

  /auth/login:
    post:
      tags: [auth]
      summary: Authenticate with a local (username/password) identity and receive a new session
      description: |
        Creates a HyveSession object (the revocable record /auth/logout
        deletes and /auth/refresh checks) and returns both halves of the
        resulting credential — see LoginResponse.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login succeeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          description: Missing username/password or malformed body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Invalid username or password (the same error either way — login never reveals which usernames exist)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /auth/refresh:
    post:
      tags: [auth]
      summary: Exchange a still-valid session token for a new access token
      description: |
        Does not require the Authorization header — that's the whole
        point, it must still work once the access token it's replacing has
        already expired. Looks up the HyveSession named by sessionToken's
        id half and checks the presented secret half against its stored
        hash. The session token itself is never reissued by this call —
        only a fresh access token.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SessionTokenRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RefreshResponse"
        "400":
          description: Malformed session token or request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Session not found, expired, or the presented secret didn't match
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /auth/logout:
    post:
      tags: [auth]
      summary: Revoke a session
      security: []
      description: |
        Deletes the HyveSession named by the presented session token — real,
        immediate revocation: the very next /auth/refresh against it fails.
        Any access token already cached from it keeps working until its own
        short TTL lapses regardless (see AccessTokenTTL) — there's no
        cheaper way to invalidate an already-issued one. Best-effort and
        always returns 200: a missing/malformed session token or an
        already-gone session isn't an error from the caller's perspective,
        since the end state is identical either way.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SessionTokenRequest"
      responses:
        "200":
          description: OK

  /api/whoami:
    get:
      tags: [auth]
      summary: Confirm the caller's session and resolved role
      description: Reaching this handler at all already proves the session is valid — used by `hyve whoami` to verify a locally-stored session against the server rather than trusting the local record alone.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  username: { type: string }
                  role: { type: string }
                required: [username, role]
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/clusters:
    get:
      tags: [clusters]
      summary: List ClusterDefinitions
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ClusterDTO"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [clusters]
      summary: Create a ClusterDefinition
      description: |
        Requires the `admin` role. Either `spec` (validated by the same
        Kubernetes CRD schema `kubectl apply` would enforce) or `template`
        must be set — `template` names an existing Template CR and renders
        it server-side (the same rendering POST /api/templates/{name}/render
        uses standalone) into the new cluster's spec in one round trip,
        rather than requiring a separate render-then-create call.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateClusterRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClusterDTO"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: Caller's role is not admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: A cluster with this name already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/clusters/{name}:
    get:
      tags: [clusters]
      summary: Get a ClusterDefinition by name
      parameters:
        - $ref: "#/components/parameters/ClusterName"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClusterDTO"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [clusters]
      summary: Delete a ClusterDefinition
      description: |
        Requires the `admin` role. Real cleanup is finalizer-driven (module
        delete op, onDelete/afterDelete workflows) — this just marks the
        object for deletion, the same as `kubectl delete`.
      parameters:
        - $ref: "#/components/parameters/ClusterName"
      responses:
        "204":
          description: Deletion initiated
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: Caller's role is not admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404": { $ref: "#/components/responses/NotFound" }

  /api/clusters/{name}/resources:
    get:
      tags: [clusters]
      summary: Get a cluster's declared and currently-applied resources
      description: |
        A separate endpoint from GET /api/clusters/{name} specifically so
        that base listing/get stays lean — a cluster can declare an
        arbitrary number of resources, and most callers don't need them.
      parameters:
        - $ref: "#/components/parameters/ClusterName"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClusterResourcesDTO"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/clusters/{name}/auth-context:
    get:
      tags: [clusters]
      summary: Get the data needed to run a driver module's auth op client-side
      description: |
        Only serves clusters using the default client-side auth method
        (spec.access.method unset) — a cluster using the module-auth or
        tunnel access override, or the API's own configured primary
        cluster, is rejected with 409 (fetch its kubeconfig via
        GET /api/kubeconfig instead). Deliberately more sensitive than
        ClusterDTO: this is the one legitimate place driverOutputs/params
        get exposed, since a client-side `hyve cluster auth` needs them to
        actually run the module's auth.yaml locally.
      parameters:
        - $ref: "#/components/parameters/ClusterName"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthContextDTO"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: This cluster doesn't use client-side auth — fetch its kubeconfig via GET /api/kubeconfig instead
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/templates:
    get:
      tags: [templates]
      summary: List Templates
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TemplateDTO"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [templates]
      summary: Create a Template
      description: Requires the `admin` role.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTemplateRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TemplateDTO"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: Caller's role is not admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: A template with this name already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/templates/{name}:
    get:
      tags: [templates]
      summary: Get a Template by name
      parameters:
        - $ref: "#/components/parameters/TemplateName"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TemplateDTO"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [templates]
      summary: Delete a Template
      description: Requires the `admin` role. Only removes the scaffold — clusters already created from it are unaffected.
      parameters:
        - $ref: "#/components/parameters/TemplateName"
      responses:
        "204":
          description: Deleted
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: Caller's role is not admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404": { $ref: "#/components/responses/NotFound" }

  /api/templates/{name}/render:
    post:
      tags: [templates]
      summary: Preview-render a Template into a ClusterDefinitionSpec
      description: |
        Requires the `admin` role (the only role that can subsequently act
        on the result via POST /api/clusters anyway). Merges the template's
        default params with any `params` override (override wins) and
        resolves `region` (request value, else the template's own default).
        Purely a preview — no cluster object is created.
      parameters:
        - $ref: "#/components/parameters/TemplateName"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RenderTemplateRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClusterDefinitionSpec"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: Caller's role is not admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404": { $ref: "#/components/responses/NotFound" }

  /api/workflows:
    get:
      tags: [workflows]
      summary: List Workflows
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WorkflowDTO"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [workflows]
      summary: Create a Workflow
      description: Requires the `admin` role.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateWorkflowRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowDTO"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: Caller's role is not admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: A workflow with this name already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/workflows/{name}:
    get:
      tags: [workflows]
      summary: Get a Workflow by name
      parameters:
        - $ref: "#/components/parameters/WorkflowName"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowDTO"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [workflows]
      summary: Delete a Workflow
      description: Requires the `admin` role.
      parameters:
        - $ref: "#/components/parameters/WorkflowName"
      responses:
        "204":
          description: Deleted
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: Caller's role is not admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404": { $ref: "#/components/responses/NotFound" }

  /api/modules:
    get:
      tags: [modules]
      summary: List Modules
      description: |
        Read-only — the API never writes Module CRs. Each one is a
        visibility record the controller creates as a side effect of
        auto-resolving a driver module referenced by some ClusterDefinition
        (see internal/controller/reconciler.go's resolveModuleIfNeeded) —
        there's no user-triggered `hyve module install` equivalent in
        cluster mode, resolution just happens live on the next reconcile.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ModuleDTO"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/modules/{name}:
    get:
      tags: [modules]
      summary: Get a Module by name
      parameters:
        - $ref: "#/components/parameters/ModuleName"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModuleDTO"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/secrets:
    get:
      tags: [secrets]
      summary: List secret key names, or (with ?values=true) every key/value
      description: |
        Every secret set via `hyve env secrets` (cluster mode) lives in one
        shared Kubernetes Secret for this hyve-api deployment — not scoped
        per caller/environment. Key names alone are readable by any
        authenticated role; `?values=true` additionally requires the
        `admin` role and returns the full key->value map in one round trip
        (used by cmd/shared's LoadEnvironmentSecrets rather than fetching
        each key individually).
      parameters:
        - name: values
          in: query
          schema:
            type: boolean
          description: Return the full key->value map instead of just key names. Requires the admin role.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                oneOf:
                  - type: array
                    items: { type: string }
                    description: Key names only (default)
                  - type: object
                    additionalProperties: { type: string }
                    description: Full key->value map (?values=true)
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/secrets/{key}:
    get:
      tags: [secrets]
      summary: Get a single secret's value
      description: Requires the `admin` role.
      parameters:
        - $ref: "#/components/parameters/SecretKey"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  key: { type: string }
                  value: { type: string }
                required: [key, value]
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: Caller's role is not admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [secrets]
      summary: Add or update a secret
      description: Requires the `admin` role. Creates the shared secrets Secret on first use if it doesn't exist yet.
      parameters:
        - $ref: "#/components/parameters/SecretKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                value: { type: string }
              required: [value]
      responses:
        "204":
          description: Set
        "400":
          description: Key doesn't match the required env-var-name pattern (^[A-Za-z_][A-Za-z0-9_]*$), or malformed body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: Caller's role is not admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      tags: [secrets]
      summary: Remove a secret
      description: Requires the `admin` role. Idempotent — removing a key that isn't set still returns 204.
      parameters:
        - $ref: "#/components/parameters/SecretKey"
      responses:
        "204":
          description: Removed (or already absent)
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: Caller's role is not admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/kubeconfig:
    get:
      tags: [kubeconfig]
      summary: Mint a kubeconfig for a managed cluster
      description: |
        Dispatches to one of three access strategies depending on `cluster`:
          - the API's own configured primary-cluster-name: mints a scoped
            ServiceAccount token via TokenRequest and returns a kubeconfig
            whose server: points back at this API's own /proxy path.
          - any other cluster left at the `module-auth` default: runs that
            cluster's driver module's auth.yaml live and returns the
            resulting kubeconfig, no stored Secret involved.
          - a cluster with spec.access.method: tunnel: reads a pre-minted
            kubeconfig from a stored Secret, no live provider call.
      parameters:
        - name: cluster
          in: query
          required: true
          description: Cluster name — either the primary-cluster-name sentinel, or a ClusterDefinition's name
          schema:
            type: string
      responses:
        "200":
          description: A kubeconfig YAML document, ready to use with `kubectl --kubeconfig`
          content:
            application/yaml:
              schema:
                type: string
        "400":
          description: Missing cluster query parameter
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502":
          description: The access provider (module auth.yaml, TokenRequest, or stored Secret read) failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: accessToken returned by POST /auth/login or /auth/refresh
  parameters:
    ClusterName:
      name: name
      in: path
      required: true
      schema:
        type: string
    TemplateName:
      name: name
      in: path
      required: true
      schema:
        type: string
    WorkflowName:
      name: name
      in: path
      required: true
      schema:
        type: string
    ModuleName:
      name: name
      in: path
      required: true
      schema:
        type: string
    SecretKey:
      name: key
      in: path
      required: true
      schema:
        type: string
  responses:
    BadRequest:
      description: Malformed request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Missing, malformed, or expired session token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Authenticated but no matching HyveAccessBinding (or insufficient role)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: No such object
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
      required: [error]
    LoginRequest:
      type: object
      properties:
        username: { type: string }
        password: { type: string, format: password }
      required: [username, password]
    LoginResponse:
      type: object
      description: |
        Two distinct credentials, not one — see HyveSession's own design
        rationale for why. accessToken is what's sent on every /api/*
        request (stateless, short-lived, verified locally by the server).
        sessionToken is the longer-lived, revocable credential — shaped
        "<id>.<secret>" — POST /auth/refresh consumes to mint a new
        accessToken without ever re-sending a username/password. Store
        both; a client that discards sessionToken can't silently renew and
        will need a fresh login once accessToken expires.
      properties:
        accessToken: { type: string }
        accessTokenExpiresAt: { type: string, format: date-time }
        sessionToken: { type: string }
        sessionExpiresAt: { type: string, format: date-time }
      required: [accessToken, accessTokenExpiresAt, sessionToken, sessionExpiresAt]
    SessionTokenRequest:
      type: object
      description: Shared request body for POST /auth/refresh and POST /auth/logout.
      properties:
        sessionToken: { type: string, description: "The \"<id>.<secret>\" value from LoginResponse.sessionToken" }
      required: [sessionToken]
    RefreshResponse:
      type: object
      properties:
        accessToken: { type: string }
        accessTokenExpiresAt: { type: string, format: date-time }
      required: [accessToken, accessTokenExpiresAt]
    ClusterDTO:
      type: object
      description: Deliberately excludes driverOutputs and any kubeconfig/credential data.
      properties:
        name: { type: string }
        driver: { type: string, description: "spec.driver.source" }
        conditions:
          type: array
          items:
            type: object
            properties:
              type: { type: string }
              status: { type: string }
              reason: { type: string }
              message: { type: string }
        observedGeneration: { type: integer, format: int64 }
        accessMethod: { type: string, enum: ["", "module-auth", "tunnel"] }
        accessLastMinted: { type: string, format: date-time }
      required: [name, driver, observedGeneration]
    ClusterResourcesDTO:
      type: object
      properties:
        resources:
          type: array
          items:
            $ref: "#/components/schemas/ResourceRef"
        appliedResources:
          type: object
          additionalProperties:
            type: object
            description: Reconciler-owned state tracking what got applied for one resources[] entry — never hand-edited.
    AuthContextDTO:
      type: object
      description: Only served for clusters using the default client-side auth method — see GET /api/clusters/{name}/auth-context.
      properties:
        driverSource: { type: string }
        driverVersion: { type: string }
        region: { type: string }
        params:
          type: object
          additionalProperties: { type: string }
        driverOutputs:
          type: object
          additionalProperties: { type: string }
      required: [driverSource, driverVersion]
    DriverRef:
      type: object
      properties:
        source: { type: string, example: "./modules/civo" }
        version: { type: string, example: "latest" }
    RunnerSpec:
      type: object
      description: |
        Configures the container image cluster mode dispatches this
        cluster's module create/status/delete/auth operations to as a
        Kubernetes Job. A module's own module.yaml can recommend/document a
        suitable image but doesn't choose one — that's this field's job,
        set directly on a ClusterDefinition or inherited from the Template
        it was created from. Falls back to HyveConfig.spec.defaultModuleImage
        when unset. Ignored in local/CLI mode, where modules always run
        inline.
      properties:
        image: { type: string, example: "ghcr.io/org/module-runner:1.0.0" }
    WorkflowRef:
      type: object
      description: Either name (a local Workflow, resolved by name — see CRDSource) or source (a remote git ref, e.g. "github.com/org/repo//path/workflow.yaml@v1") is set, not both.
      properties:
        name: { type: string }
        source: { type: string }
        path: { type: string, description: "Overrides an inline //path in source, if both are set." }
    WorkflowsSpec:
      type: object
      description: Lifecycle hooks — each a list of WorkflowRefs run in order at the named point in a cluster's lifecycle.
      properties:
        preReconcile:
          type: array
          items: { $ref: "#/components/schemas/WorkflowRef" }
        beforeCreate:
          type: array
          items: { $ref: "#/components/schemas/WorkflowRef" }
        onCreate:
          type: array
          items: { $ref: "#/components/schemas/WorkflowRef" }
        afterCreate:
          type: array
          items: { $ref: "#/components/schemas/WorkflowRef" }
        onDelete:
          type: array
          items: { $ref: "#/components/schemas/WorkflowRef" }
        afterDelete:
          type: array
          items: { $ref: "#/components/schemas/WorkflowRef" }
    ResourceRef:
      type: object
      description: One Kubernetes manifest (or Helm release, or Secret) hyve should own, drift-check, and re-apply on every reconcile cycle for an ACTIVE cluster.
      properties:
        name: { type: string }
        source: { type: string, description: "Path to a manifest file, mutually exclusive with helm/secret." }
        namespace: { type: string }
        delete: { type: boolean, description: "Marks this entry for removal on the next reconcile." }
        helm:
          type: object
          properties:
            chart: { type: string }
            repo: { type: string }
            version: { type: string }
            namespace: { type: string }
            values:
              type: object
              additionalProperties: true
        secret:
          type: object
          properties:
            namespace: { type: string }
            type: { type: string }
            keys:
              type: array
              items:
                type: object
                properties:
                  env: { type: string }
                  key: { type: string }
    ClusterDefinitionSpec:
      type: object
      description: Same schema `kubectl apply` on a ClusterDefinition would enforce.
      properties:
        region: { type: string }
        driver:
          $ref: "#/components/schemas/DriverRef"
        runner:
          $ref: "#/components/schemas/RunnerSpec"
        params:
          type: object
          additionalProperties: { type: string }
        workflows:
          $ref: "#/components/schemas/WorkflowsSpec"
        resources:
          type: array
          items:
            $ref: "#/components/schemas/ResourceRef"
        delete: { type: boolean }
        pause: { type: boolean }
        expiresAt: { type: string, format: date-time }
        dependsOn:
          type: array
          items: { type: string }
        access:
          type: object
          properties:
            method: { type: string, enum: ["", "module-auth", "tunnel"] }
            tunnel:
              type: object
              properties:
                provider: { type: string, enum: ["rancher", "teleport"] }
    CreateClusterRequest:
      type: object
      description: Either spec or template must be set — see POST /api/clusters.
      properties:
        name: { type: string }
        spec:
          $ref: "#/components/schemas/ClusterDefinitionSpec"
        template:
          $ref: "#/components/schemas/CreateClusterFromTemplateRef"
      required: [name]
    CreateClusterFromTemplateRef:
      type: object
      properties:
        name: { type: string, description: "Template CR name" }
        region: { type: string, description: "Overrides the template's default region" }
        params:
          type: object
          additionalProperties: { type: string }
          description: Merged with the template's default params (override wins).
      required: [name]
    TemplateSpec:
      type: object
      description: Same schema `kubectl apply` on a Template would enforce — a reusable ClusterDefinition scaffold.
      properties:
        description: { type: string }
        driver:
          $ref: "#/components/schemas/DriverRef"
        runner:
          $ref: "#/components/schemas/RunnerSpec"
        params:
          type: object
          additionalProperties: { type: string }
        region: { type: string }
        workflows:
          $ref: "#/components/schemas/WorkflowsSpec"
        resources:
          type: array
          items:
            $ref: "#/components/schemas/ResourceRef"
        schedule: { type: string, description: "5-field cron expression — when set, a cluster created from this template gets spec.expiresAt set to the next occurrence." }
        lockParams: { type: boolean, description: "Reject rather than silently ignore a param override at cluster-creation time." }
    TemplateDTO:
      type: object
      properties:
        name: { type: string }
        spec:
          $ref: "#/components/schemas/TemplateSpec"
      required: [name, spec]
    CreateTemplateRequest:
      type: object
      properties:
        name: { type: string }
        spec:
          $ref: "#/components/schemas/TemplateSpec"
      required: [name]
    RenderTemplateRequest:
      type: object
      properties:
        region: { type: string, description: "Overrides the template's default region" }
        params:
          type: object
          additionalProperties: { type: string }
    WorkflowStep:
      type: object
      properties:
        name: { type: string }
        description: { type: string }
        if: { type: string }
        command: { type: string }
        script: { type: string }
        action: { type: string }
        with:
          type: object
          additionalProperties: { type: string }
        env:
          type: object
          additionalProperties: { type: string }
        workingDir: { type: string }
        timeout: { type: string }
        continueOnError: { type: boolean }
        container: { type: string, description: "Overrides the parent job's container: for this step only." }
      required: [name]
    WorkflowJob:
      type: object
      properties:
        name: { type: string }
        description: { type: string }
        if: { type: string }
        dependsOn:
          type: array
          items: { type: string }
        cluster: { type: string }
        env:
          type: object
          additionalProperties: { type: string }
        steps:
          type: array
          items:
            $ref: "#/components/schemas/WorkflowStep"
        timeout: { type: string }
        retry:
          type: object
          properties:
            maxAttempts: { type: integer }
            delay: { type: string }
        container: { type: string, description: "Image every step in this job runs in under cluster mode's Job dispatch. A step's own container overrides this; HyveConfig.spec.defaultWorkflowImage is the last fallback before a hard pre-flight failure." }
      required: [name, steps]
    WorkflowSpec:
      type: object
      description: Same schema `kubectl apply` on a Workflow would enforce.
      properties:
        description: { type: string }
        inputs:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              description: { type: string }
              default: { type: string }
            required: [name]
        requirements:
          type: object
          properties:
            tools:
              type: array
              items:
                type: object
                properties:
                  name: { type: string }
                  version: { type: string }
                  description: { type: string }
                required: [name]
            secrets:
              type: array
              items:
                type: object
                properties:
                  name: { type: string }
                  provider: { type: string }
                  required: { type: boolean }
                  description: { type: string }
                required: [name, required]
        preFlight:
          type: object
          properties:
            cluster: { type: string }
        triggers:
          type: array
          items:
            type: object
            properties:
              type: { type: string }
              config:
                type: object
                additionalProperties: { type: string }
            required: [type]
        jobs:
          type: array
          items:
            $ref: "#/components/schemas/WorkflowJob"
        env:
          type: object
          additionalProperties: { type: string }
        runtime: { type: string, enum: ["client", "cluster"], description: "Defaults to cluster when unset." }
        secretsFrom:
          type: array
          items:
            type: object
            description: One Kubernetes Secret to resolve into env vars before this workflow's steps run.
            properties:
              cluster: { type: string }
              namespace: { type: string }
              secretRef: { type: string }
              keys:
                type: array
                items:
                  type: object
                  properties:
                    key: { type: string }
                    env: { type: string }
                  required: [key]
            required: [cluster, namespace, secretRef, keys]
      required: [jobs]
    WorkflowDTO:
      type: object
      properties:
        name: { type: string }
        spec:
          $ref: "#/components/schemas/WorkflowSpec"
      required: [name, spec]
    CreateWorkflowRequest:
      type: object
      properties:
        name: { type: string }
        spec:
          $ref: "#/components/schemas/WorkflowSpec"
      required: [name]
    ModuleDTO:
      type: object
      description: Read-only — see GET /api/modules.
      properties:
        name: { type: string }
        spec:
          type: object
          properties:
            source: { type: string }
            version: { type: string }
        status:
          type: object
          properties:
            resolved: { type: boolean }
            resolvedAt: { type: string, format: date-time }
            sha256: { type: string }
            error: { type: string }
      required: [name, spec, status]
