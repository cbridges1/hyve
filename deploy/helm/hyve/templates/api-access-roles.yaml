{{- if .Values.api.accessRoles.create }}
# The two default roles HyveAccessBinding.spec.serviceAccountRef points at
# — a caller matched to an "admin" binding gets a token minted against
# hyve-access-admin (bound to the built-in cluster-admin ClusterRole — this
# cluster's own real RBAC is the actual authority once a caller reaches it
# via /proxy, not a second hyve-side check); "read-only" gets
# hyve-access-readonly (bound to the built-in view ClusterRole). A custom
# role can point serviceAccountRef at any other ServiceAccount instead,
# without touching this chart.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: hyve-access-admin
  namespace: {{ .Values.namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: hyve-access-admin
subjects:
  - kind: ServiceAccount
    name: hyve-access-admin
    namespace: {{ .Values.namespace }}
roleRef:
  kind: ClusterRole
  name: cluster-admin
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: hyve-access-readonly
  namespace: {{ .Values.namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: hyve-access-readonly
subjects:
  - kind: ServiceAccount
    name: hyve-access-readonly
    namespace: {{ .Values.namespace }}
roleRef:
  kind: ClusterRole
  name: view
  apiGroup: rbac.authorization.k8s.io
{{- end }}
