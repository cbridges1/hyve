{{- if .Values.api.accessRoles.create }}
# The two default roles HyveAccessBinding.spec.serviceAccountRef points at
# — a caller matched to an "admin" binding gets a token minted against
# hyve-access-admin (bound to the built-in cluster-admin ClusterRole,
# scoped to this install's own namespace by default — this cluster's own
# real RBAC is the actual authority once a caller reaches it via /proxy,
# not a second hyve-side check); "read-only" gets hyve-access-readonly
# (bound to the built-in view ClusterRole, same scoping). A custom role can
# point serviceAccountRef at any other ServiceAccount instead, without
# touching this chart.
#
# api.accessRoles.clusterScoped (default false) controls whether these
# bindings are namespaced RoleBindings (safe for multiple hyve installs
# sharing one cluster — each tenant's "admin" is admin of only its own
# namespace) or cluster-wide ClusterRoleBindings (the pre-multi-tenancy
# behavior — only appropriate for a genuinely single-tenant cluster, since
# it grants real cluster-admin/view over the whole cluster, not just this
# install's namespace).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: hyve-access-admin
  namespace: {{ .Values.namespace }}
---
{{- if .Values.api.accessRoles.clusterScoped }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: hyve-access-admin
subjects:
  - kind: ServiceAccount
    name: hyve-access-admin
    namespace: {{ .Values.namespace }}
roleRef:
  kind: ClusterRole
  name: cluster-admin
  apiGroup: rbac.authorization.k8s.io
{{- else }}
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: hyve-access-admin
  namespace: {{ .Values.namespace }}
subjects:
  - kind: ServiceAccount
    name: hyve-access-admin
    namespace: {{ .Values.namespace }}
roleRef:
  kind: ClusterRole
  name: cluster-admin
  apiGroup: rbac.authorization.k8s.io
{{- end }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: hyve-access-readonly
  namespace: {{ .Values.namespace }}
---
{{- if .Values.api.accessRoles.clusterScoped }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: hyve-access-readonly
subjects:
  - kind: ServiceAccount
    name: hyve-access-readonly
    namespace: {{ .Values.namespace }}
roleRef:
  kind: ClusterRole
  name: view
  apiGroup: rbac.authorization.k8s.io
{{- else }}
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: hyve-access-readonly
  namespace: {{ .Values.namespace }}
subjects:
  - kind: ServiceAccount
    name: hyve-access-readonly
    namespace: {{ .Values.namespace }}
roleRef:
  kind: ClusterRole
  name: view
  apiGroup: rbac.authorization.k8s.io
{{- end }}
---
# hyve-host-admin backs the host-cluster access path (spec.access.method:
# primary — see HYVE-MULTI-TENANCY-PLAN.md's "Host cluster access"
# section): the cluster hyve-controller/hyve-api themselves run on. Always
# a standing ClusterRoleBinding to cluster-admin, unconditionally — this is
# deliberately NOT gated by accessRoles.clusterScoped like hyve-access-
# admin/hyve-access-readonly above: the host cluster IS the entire control
# plane (every tenant namespace, every controller/API pod, every Secret),
# so "manage it the same way as other clusters" genuinely means
# unrestricted access once you're allowed in at all. The safety comes
# entirely from PrimaryClusterProvider.Kubeconfig requiring the caller's
# resolved role to be superadmin before it will ever mint a token against
# this ServiceAccount — never from narrowing what the ServiceAccount
# itself can do.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: hyve-host-admin
  namespace: {{ .Values.namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: hyve-host-admin
subjects:
  - kind: ServiceAccount
    name: hyve-host-admin
    namespace: {{ .Values.namespace }}
roleRef:
  kind: ClusterRole
  name: cluster-admin
  apiGroup: rbac.authorization.k8s.io
{{- end }}
