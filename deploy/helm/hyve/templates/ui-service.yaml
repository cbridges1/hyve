{{- if .Values.ui.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: hyve-ui
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: hyve-ui
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: hyve-ui
  ports:
    - name: http
      port: {{ .Values.ui.service.port }}
      targetPort: http
{{- end }}
