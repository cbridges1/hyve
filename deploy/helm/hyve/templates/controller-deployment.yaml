{{- if .Values.controller.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hyve-controller
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: hyve-controller
spec:
  # One replica: the webhook certificate is made at start-up.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: hyve-controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hyve-controller
    spec:
      serviceAccountName: hyve-controller
      containers:
        - name: controller
          image: {{ include "hyve.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["hyve"]
          args:
            - controller
            - --service-name=hyve-controller
            - --service-namespace={{ .Values.namespace }}
            - --cert-dir=/tmp/hyve-webhook
            {{- if not .Values.controller.webhook }}
            - --no-webhook
            {{- end }}
            {{- if .Values.controller.lazyProviders }}
            - --lazy-providers
            {{- end }}
            {{- if and .Values.host.enabled .Values.host.agentURL }}
            - --host-url={{ .Values.host.agentURL }}
            - --agent-image={{ .Values.host.agentImage }}
            - --agent-namespace={{ .Values.namespace }}
            {{- if .Values.host.caCertsConfigMap }}
            - --host-cacerts=/etc/hyve/cacerts/ca.crt
            {{- end }}
            {{- end }}
          ports:
            - name: webhook
              containerPort: 9443
            - name: probes
              containerPort: 8081
          livenessProbe:
            httpGet:
              path: /healthz
              port: probes
          readinessProbe:
            httpGet:
              path: /healthz
              port: probes
          resources:
            {{- toYaml .Values.controller.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- if and .Values.host.enabled .Values.host.caCertsConfigMap }}
            - name: cacerts
              mountPath: /etc/hyve/cacerts
              readOnly: true
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- if and .Values.host.enabled .Values.host.caCertsConfigMap }}
        - name: cacerts
          configMap:
            name: {{ .Values.host.caCertsConfigMap }}
        {{- end }}
{{- end }}
