{{- if .Values.controller.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.controller.serviceAccount.name | default "hyve-controller" }}
  namespace: {{ .Values.namespace }}
{{- end }}
---
# Namespace-scoped Role, not a ClusterRole — ClusterDefinition/HyveConfig
# are both Namespaced CRDs (see internal/apis/hyve/v1alpha1), and Jobs/Pods
# for KubernetesJobStepRunner live in the same namespace. The controller
# never needs cluster-wide access for anything this chart deploys.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: hyve-controller
  namespace: {{ .Values.namespace }}
rules:
  - apiGroups: ["hyve.io"]
    resources: ["clusterdefinitions"]
    verbs: ["get", "list", "watch", "update", "patch", "delete"]
  - apiGroups: ["hyve.io"]
    resources: ["clusterdefinitions/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["hyve.io"]
    resources: ["hyveconfigs"]
    verbs: ["get", "list", "watch"]
  # watch is required, not decorative, even though the controller never
  # registers a Watches()/For() builder for this kind — a controller-runtime
  # cached client needs watch permission to populate its informer cache for
  # ANY Get/List against a scheme-registered type, or every lookup silently
  # fails. Same failure class that already bit
  # internal/api/clusters.go's namespace-scoped List once this session.
  - apiGroups: ["hyve.io"]
    resources: ["workflows"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
{{- if .Values.controller.leaderElection }}
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: hyve-controller
  namespace: {{ .Values.namespace }}
subjects:
  - kind: ServiceAccount
    name: {{ .Values.controller.serviceAccount.name | default "hyve-controller" }}
    namespace: {{ .Values.namespace }}
roleRef:
  kind: Role
  name: hyve-controller
  apiGroup: rbac.authorization.k8s.io
