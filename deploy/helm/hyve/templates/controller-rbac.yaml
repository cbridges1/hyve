{{- if .Values.controller.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: hyve-controller
  namespace: {{ .Values.namespace }}
---
# hyve-controller fills in and guards templated Clusters, deletes expired
# ones, and turns templates' resources into Fleet objects, in every
# namespace (templates and environments are namespaces).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: hyve-controller
rules:
  - apiGroups: ["cluster.x-k8s.io"]
    resources: ["clusters"]
    verbs: ["get", "list", "watch", "update", "patch", "delete"]
  - apiGroups: ["cluster.x-k8s.io"]
    resources: ["clusterclasses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["hyve.io"]
    resources: ["clustertemplates", "resources", "clusterresources", "clusteraccesses"]
    verbs: ["get", "list", "watch", "patch", "update"]
  - apiGroups: ["hyve.io"]
    resources: ["clusteraccesses"]
    verbs: ["create"]
  - apiGroups: ["hyve.io"]
    resources: ["clustertemplates/status", "resources/status", "clusterresources/status", "clusteraccesses/status"]
    verbs: ["get", "patch", "update"]
  # ClusterAccess: role templates, and the Roles limited to each cluster.
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["clusterroles"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles", "rolebindings"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["fleet.cattle.io"]
    resources: ["helmops", "bundles", "gitrepos"]
    verbs: ["get", "list", "watch", "create", "patch", "update", "delete"]
  # Whether a resource's Secrets exist; read uncached, metadata only.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
  # Push delivery (internal/operator/push.go): for children whose agent
  # can't reach this cluster, BundleDeployments are deployed from here by
  # Jobs (in the child's namespace, with its CAPI kubeconfig), and their
  # status written as fleet-agent writes it. The Jobs' inputs and packaged
  # charts are Secrets labelled hyve.io/push-cluster.
  - apiGroups: ["fleet.cattle.io"]
    resources: ["clusters", "bundledeployments"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["fleet.cattle.io"]
    resources: ["bundledeployments/status"]
    verbs: ["get", "patch", "update"]
  - apiGroups: ["fleet.cattle.io"]
    resources: ["contents"]
    verbs: ["get"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get"]
  # fleet-controller's image, for the Jobs.
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
  # The controller makes its own webhook certificate and sets the CA here.
  - apiGroups: ["admissionregistration.k8s.io"]
    resources: ["mutatingwebhookconfigurations", "validatingwebhookconfigurations"]
    resourceNames: ["00-hyve-controller", "hyve-controller"]
    verbs: ["get", "update"]
{{- if and .Values.host.enabled .Values.host.agentURL }}
---
# Agent registration: each child cluster's registration token and what its
# agent reports live in the host's namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: hyve-controller-agents
  namespace: {{ .Values.namespace }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: hyve-controller-agents
  namespace: {{ .Values.namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: hyve-controller-agents
subjects:
  - kind: ServiceAccount
    name: hyve-controller
    namespace: {{ .Values.namespace }}
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: hyve-controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: hyve-controller
subjects:
  - kind: ServiceAccount
    name: hyve-controller
    namespace: {{ .Values.namespace }}
{{- end }}
