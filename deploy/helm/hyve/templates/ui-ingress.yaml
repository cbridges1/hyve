{{- if .Values.ui.enabled }}
{{- if not .Values.api.ingress.enabled }}
{{- fail "ui.enabled requires api.ingress.enabled: true — web/ only ever makes relative (/api/..., /auth/...) requests, so it must be served from the exact same origin as hyve-api" }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hyve-ui
  namespace: {{ .Values.namespace }}
spec:
  # Deliberately reuses api.ingress.host, not a separate ui.ingress.host —
  # see values.yaml's own comment on why the UI can never live on a
  # different host than the API.
  ingressClassName: {{ .Values.ui.ingress.className | default .Values.api.ingress.className }}
  rules:
    - host: {{ .Values.api.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: hyve-ui
                port:
                  number: {{ .Values.ui.service.port }}
{{- end }}
