apiVersion: apps/v1
kind: Deployment
metadata:
  name: hyve-api
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: hyve-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: hyve-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hyve-api
    spec:
      serviceAccountName: {{ .Values.api.serviceAccount.name | default "hyve-api" }}
      containers:
        - name: api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # The image's own ENTRYPOINT is just ["hyve"] (unlike
          # deploy/Dockerfile.controller's fixed "cluster-config controller
          # run") — command+args here select the cluster-config api
          # subcommand, so the same image backs both this Deployment and
          # hyve-controller's.
          command: ["hyve"]
          args:
            - cluster-config
            - api
            - run
            - --namespace={{ .Values.namespace }}
            - --modules-dir={{ .Values.api.modulesDir }}
            - --bind-address={{ .Values.api.bindAddress }}
            {{- if .Values.api.publicBaseURL }}
            - --public-base-url={{ .Values.api.publicBaseURL }}
            {{- end }}
            {{- if .Values.api.hostServiceAccount }}
            - --host-service-account={{ .Values.api.hostServiceAccount }}
            {{- end }}
            - --proxy-target={{ .Values.api.proxyTarget }}
            - --relay-bind-address={{ .Values.api.relayBindAddress }}
            - --relay-base-url={{ .Values.api.relayBaseURL | default (printf "http://hyve-api-internal.%s.svc.cluster.local%s" .Values.namespace .Values.api.relayBindAddress) }}
          ports:
            - name: http
              containerPort: {{ .Values.api.bindAddress | trimPrefix ":" }}
            - name: relay
              containerPort: {{ .Values.api.relayBindAddress | trimPrefix ":" }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
