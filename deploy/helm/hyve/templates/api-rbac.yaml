{{- if .Values.api.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.api.serviceAccount.name | default "hyve-api" }}
  namespace: {{ .Values.namespace }}
{{- end }}
---
# Namespace-scoped: ClusterDefinition/Template/Workflow CRUD, Secrets
# (credentials + tunnel kubeconfigs), TokenRequest (minting on behalf of a
# caller's matched HyveAccessBinding — see internal/api/access.go's
# PrimaryClusterProvider), and read access to Jobs/Pods/pod logs for the
# future log-streaming endpoint (Phase 6.7, not yet implemented — granted
# now so a later rollout of that feature needs no RBAC change).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: hyve-api
  namespace: {{ .Values.namespace }}
rules:
  - apiGroups: ["hyve.io"]
    resources: ["clusterdefinitions"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: ["hyve.io"]
    resources: ["clusterdefinitions/status"]
    verbs: ["get"]
  - apiGroups: ["hyve.io"]
    resources: ["templates", "workflows", "resources"]
    verbs: ["get", "list", "watch", "create", "delete"]
  # HyveAccessBinding is namespaced (one install = one tenant = one
  # namespace — see hyveaccessbinding_types.go), so this lives in the same
  # namespaced Role as everything else above rather than a ClusterRole.
  # create/delete (beyond the original get/list/watch, needed since Phase
  # 6's own auth middleware) back the admin-facing account-management
  # endpoints in accounts.go (GET/POST/DELETE /accounts) — before that,
  # HyveAccessBinding was only ever written via `hyve cluster-config api
  # create-user` + kubectl, never by this API itself.
  - apiGroups: ["hyve.io"]
    resources: ["hyveaccessbindings"]
    verbs: ["get", "list", "watch", "create", "delete"]
  # HyveSession backs POST /auth/login, /auth/refresh, /auth/logout (see
  # internal/api/auth_handlers.go) — the durable, revocable record behind
  # every session. No list/watch here unlike the resources above: this
  # API's own client is built via client.New (cmd/api/run.go), an
  # uncached, direct-to-API-server client, not a controller-runtime
  # manager's cached client — so there's no informer to populate, and
  # Get/Create/Delete alone are both necessary and sufficient (confirmed
  # against the exact same cached-vs-uncached distinction that governs
  # hyve-controller's own RBAC — see controller-rbac.yaml's hyve-cli-secrets
  # comment for the cached-client version of this same gotcha).
  - apiGroups: ["hyve.io"]
    resources: ["hyvesessions"]
    verbs: ["get", "create", "delete"]
  # Read-only: the API never writes Module CRs (only the controller does,
  # via resolveModuleIfNeeded) — this is purely for `hyve module list`/
  # `info` in cluster mode to have something to read.
  - apiGroups: ["hyve.io"]
    resources: ["modules"]
    verbs: ["get", "list", "watch"]
  # Read-only, same reasoning as modules above: AccessMethod is
  # admin-managed via kubectl apply directly (see accessmethod_types.go's
  # own doc comment) — this is purely for `hyve cluster auth` to resolve a
  # ClusterDefinition's accessMethodRef in cluster mode.
  - apiGroups: ["hyve.io"]
    resources: ["accessmethods"]
    verbs: ["get", "list", "watch"]
  # Same read-only reasoning as modules above — only the controller writes
  # these (upsertWorkflowRefStatusCR/upsertResourceRefStatusCR); the API
  # merges them into `hyve workflow list`/`resource list`'s output
  # alongside real Workflow/Resource CRs.
  - apiGroups: ["hyve.io"]
    resources: ["workflowrefstatuses", "resourcerefstatuses"]
    verbs: ["get", "list", "watch"]
  # WorkflowRun is `hyve workflow run`'s cluster-mode execution surface
  # (internal/api/workflowruns.go) — the API only ever creates one (POST)
  # and polls its status (GET); WorkflowRunReconciler (in hyve-controller,
  # see controller-rbac.yaml) does the actual work. No update/delete here —
  # a WorkflowRun is a one-shot request the API never mutates after
  # creation.
  - apiGroups: ["hyve.io"]
    resources: ["workflowruns"]
    verbs: ["get", "list", "watch", "create"]
  - apiGroups: ["hyve.io"]
    resources: ["workflowruns/status"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
  # hyve-cli-secrets backs `hyve env secrets` in cluster mode (see
  # internal/api/secrets.go). Kubernetes RBAC can't scope "create" by
  # resourceNames at all — a rule with resourceNames simply never matches a
  # create request (confirmed live: combining create with resourceNames
  # made every create 403, not "unscoped" as might be assumed), so create
  # needs its own unscoped rule — also what access-method minting
  # (accessmethod_mint.go) needs to create its own short-lived,
  # per-request credentials Secret (name varies per mint request, so
  # resourceNames can't scope this one either). update/patch/delete CAN
  # be scoped by resourceNames and are, for hyve-cli-secrets specifically.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["update", "patch", "delete"]
    resourceNames: ["hyve-cli-secrets"]
  # Unscoped delete, unlike the resourceNames-scoped rule directly above:
  # account deletion (handleDeleteAccount, accounts.go) removes a
  # <username>-credentials Secret, and RBAC resourceNames can't do prefix/
  # pattern matching — only exact names, which is infeasible for a name
  # that varies per created account. This does let hyve-api delete *any*
  # Secret in this namespace, including hyve-api-credentials (its own
  # signing key) and hyve-cli-secrets — a real, deliberate widening, not an
  # oversight. Accepted because an admin-role caller through this API can
  # already mint a kubeconfig scoped to admin of this whole namespace via
  # the primary-cluster TokenRequest path (see access.go's
  # PrimaryClusterProvider, and api-access-roles.yaml's
  # accessRoles.clusterScoped), so this isn't a first departure from a
  # tightly-scoped baseline.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["delete"]
  - apiGroups: [""]
    resources: ["serviceaccounts/token"]
    verbs: ["create"]
  # create/delete (beyond the original read-only get/list, granted ahead
  # of Phase 6.7's log-streaming feature) back access-method minting
  # (accessmethod_mint.go) — a short-lived Job runs an AccessMethod's
  # driver module's auth operation, deleted again the moment its result
  # arrives (or its wait times out). No update/patch: this API never
  # modifies a Job in place.
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "create", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: hyve-api
  namespace: {{ .Values.namespace }}
subjects:
  - kind: ServiceAccount
    name: {{ .Values.api.serviceAccount.name | default "hyve-api" }}
    namespace: {{ .Values.namespace }}
roleRef:
  kind: Role
  name: hyve-api
  apiGroup: rbac.authorization.k8s.io
