apiVersion: v1
kind: Service
metadata:
  name: hyve-api
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: hyve-api
spec:
  type: {{ .Values.api.service.type | default "ClusterIP" }}
  selector:
    app.kubernetes.io/name: hyve-api
  ports:
    - name: http
      port: {{ .Values.api.service.port }}
      targetPort: http
      {{- if and (eq .Values.api.service.type "NodePort") .Values.api.service.nodePort }}
      nodePort: {{ .Values.api.service.nodePort }}
      {{- end }}
