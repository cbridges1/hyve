{{- if .Values.api.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hyve-api
  namespace: {{ .Values.namespace }}
spec:
  ingressClassName: {{ .Values.api.ingress.className }}
  rules:
    - host: {{ required "api.ingress.host is required when api.ingress.enabled=true" .Values.api.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: hyve-api
                port:
                  number: {{ .Values.api.service.port }}
{{- end }}
