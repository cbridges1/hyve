{{- if .Values.api.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hyve-api
  namespace: {{ .Values.namespace }}
spec:
  ingressClassName: {{ .Values.api.ingress.className }}
  rules:
    - host: {{ required "api.ingress.host is required when api.ingress.enabled=true" .Values.api.ingress.host }}
      http:
        paths:
        {{- if .Values.ui.enabled }}
          # ui-ingress.yaml owns "/" on this same host for hyve-ui — these
          # specific paths are the API's full surface per
          # internal/api/server.go's own Routes doc comment (/auth/*,
          # /healthz, /docs, /openapi.yaml, /agent/bootstrap, everything
          # under /api/, and /proxy/*). Path specificity (these are all
          # more specific than "/") is what makes both Ingress objects
          # coexist correctly on one host regardless of which the ingress
          # controller evaluates first. /agent must be externally
          # reachable since a real hyve-agent runs on a remote,
          # externally-hosted managed cluster, not inside this cluster's
          # own pod network — see
          # docs/HYVE-AGENT-ARCHITECTURE-PROPOSAL.md's "Agent identity /
          # authentication".
          {{- range list "/api" "/auth" "/healthz" "/docs" "/openapi.yaml" "/proxy" "/agent" }}
          - path: {{ . }}
            pathType: Prefix
            backend:
              service:
                name: hyve-api
                port:
                  number: {{ $.Values.api.service.port }}
          {{- end }}
        {{- else }}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: hyve-api
                port:
                  number: {{ .Values.api.service.port }}
        {{- end }}
{{- end }}
