{{- if and .Values.ui.enabled .Values.rancher.enabled }}
# hyve's Rancher UI extension: a static server for the built package, and
# the UIPlugin that tells Rancher to load it (Rancher fetches and caches the
# files from this endpoint). Without Rancher, hyve's own UI is still to
# come (HYVE-PROPOSAL.md, step 6).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hyve-ui
  namespace: cattle-ui-plugin-system
  labels: {app.kubernetes.io/name: hyve-ui}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: hyve-ui}
  template:
    metadata:
      labels: {app.kubernetes.io/name: hyve-ui}
    spec:
      containers:
        - name: server
          image: "{{ .Values.ui.image.repository }}:{{ .Values.ui.image.tag | default .Values.ui.version }}"
          imagePullPolicy: {{ .Values.ui.image.pullPolicy }}
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet: {path: "/plugin/hyve-{{ .Values.ui.version }}/plugin/package.json", port: 8080}
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {memory: 64Mi}
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities: {drop: ["ALL"]}
---
apiVersion: v1
kind: Service
metadata:
  name: hyve-ui
  namespace: cattle-ui-plugin-system
spec:
  selector: {app.kubernetes.io/name: hyve-ui}
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: catalog.cattle.io/v1
kind: UIPlugin
metadata:
  name: hyve
  namespace: cattle-ui-plugin-system
spec:
  plugin:
    name: hyve
    version: {{ .Values.ui.version | quote }}
    endpoint: "http://hyve-ui.cattle-ui-plugin-system:8080/plugin/hyve-{{ .Values.ui.version }}"
    noCache: false
    noAuth: false
    metadata:
      catalog.cattle.io/display-name: hyve
      catalog.cattle.io/rancher-version: ">= 2.14.0-0"
      catalog.cattle.io/ui-extensions-version: ">= 3.0.0 < 4.0.0"
{{- end }}
