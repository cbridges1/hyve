{{- if .Values.host.enabled }}
# Role templates for ClusterAccess: their rules are written to child
# clusters, after Rancher's built-in Cluster Owner, Cluster Member and
# Read-only. Labelled hyve.io/role-template and never bound on the
# management cluster.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: hyve-cluster-owner
  labels: {hyve.io/role-template: "true"}
rules:
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: ["*"]
  - nonResourceURLs: ["*"]
    verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: hyve-cluster-member
  labels: {hyve.io/role-template: "true"}
rules:
  # See the cluster's infrastructure and create namespaces of their own,
  # as Rancher's Cluster Member does; workloads need a namespace role.
  - apiGroups: [""]
    resources: ["nodes", "persistentvolumes", "componentstatuses", "events"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "watch", "create"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingressclasses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["metrics.k8s.io"]
    resources: ["nodes", "pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: hyve-cluster-readonly
  labels: {hyve.io/role-template: "true"}
# Kubernetes' own view role: read everything but Secrets.
aggregationRule:
  clusterRoleSelectors:
    - matchLabels:
        rbac.authorization.k8s.io/aggregate-to-view: "true"
rules: []
---
# Environment member: create and manage clusters and their extras in a
# namespace, read the templates they're made from. Bound in an environment
# with an ordinary RoleBinding ('hyve access grant --env-member'). No
# Secrets.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: hyve-environment-member
rules:
  - apiGroups: ["cluster.x-k8s.io"]
    resources: ["clusters"]
    verbs: ["get", "list", "watch", "create"]
  - apiGroups: ["cluster.x-k8s.io"]
    resources: ["clusterclasses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["hyve.io"]
    resources: ["clusterresources"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["hyve.io"]
    resources: ["clustertemplates", "resources", "clusteraccesses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["fleet.cattle.io"]
    resources: ["clusters", "helmops", "bundles", "bundledeployments", "gitrepos"]
    verbs: ["get", "list", "watch"]
---
# Reading templates and shared resources, for environment members, in the
# template namespaces.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: hyve-template-reader
rules:
  - apiGroups: ["hyve.io"]
    resources: ["clustertemplates", "resources"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["cluster.x-k8s.io"]
    resources: ["clusterclasses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["fleet.cattle.io"]
    resources: ["helmops", "bundles", "gitrepos"]
    verbs: ["get", "list", "watch"]
{{- end }}
