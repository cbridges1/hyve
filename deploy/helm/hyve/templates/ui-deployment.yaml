{{- if .Values.ui.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hyve-ui
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: hyve-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: hyve-ui
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hyve-ui
    spec:
      containers:
        - name: ui
          image: "{{ .Values.ui.image.repository }}:{{ .Values.ui.image.tag }}"
          imagePullPolicy: {{ .Values.ui.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 80
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.ui.resources | nindent 12 }}
{{- end }}
