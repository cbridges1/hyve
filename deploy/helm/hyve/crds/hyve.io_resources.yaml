# Resource: a named, shared Fleet HelmOp, Bundle or GitRepo spec with no
# targets of its own. Templates and ClusterResources refer to it by name.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: resources.hyve.io
spec:
  group: hyve.io
  scope: Namespaced
  names:
    kind: Resource
    listKind: ResourceList
    plural: resources
    singular: resource
    shortNames: [hres]
    categories: [hyve]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Secrets
          type: string
          jsonPath: .spec.secrets
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            apiVersion: {type: string}
            kind: {type: string}
            metadata: {type: object}
            spec:
              type: object
              properties:
                namespace:
                  type: string
                  description: Namespace for the resource's objects on the cluster, unless its Fleet spec sets one.
                secrets:
                  type: array
                  description: Secrets in this object's namespace that Fleet copies to each target cluster (downstreamResources).
                  items: {type: string}
                ref:
                  type: string
                  description: A shared Resource to use instead of a spec here.
                refNamespace: {type: string}
                values:
                  type: object
                  description: With ref, merged over the shared Resource's Helm values.
                  x-kubernetes-preserve-unknown-fields: true
                helmOp:
                  type: object
                  description: Fleet's HelmOp spec, without targets.
                  x-kubernetes-preserve-unknown-fields: true
                bundle:
                  type: object
                  description: Fleet's Bundle spec, without targets.
                  x-kubernetes-preserve-unknown-fields: true
                gitRepo:
                  type: object
                  description: Fleet's GitRepo spec, without targets.
                  x-kubernetes-preserve-unknown-fields: true
            status:
              type: object
              properties:
                observedGeneration: {type: integer}
                conditions:
                  type: array
                  items:
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
                resources:
                  type: array
                  description: Each Fleet object made, with Fleet's state.
                  items:
                    type: object
                    properties:
                      name: {type: string}
                      kind: {type: string}
                      object: {type: string}
                      ready: {type: string}
                      state: {type: string}
                missingSecrets:
                  type: array
                  items: {type: string}
