# ImportedCluster: the Cluster API infrastructure of a cluster hyve didn't
# create ('hyve cluster import'). There's none to provision: hyve-controller
# reports it provisioned, and the cluster's ImportedControlPlane does the
# rest. Deleting it touches nothing.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: importedclusters.hyve.io
  labels:
    # The Cluster API contract version this kind implements.
    cluster.x-k8s.io/v1beta2: v1alpha1
    clusterctl.cluster.x-k8s.io: ""
    clusterctl.cluster.x-k8s.io/move: ""
spec:
  group: hyve.io
  scope: Namespaced
  names:
    kind: ImportedCluster
    listKind: ImportedClusterList
    plural: importedclusters
    singular: importedcluster
    categories: [hyve, cluster-api]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Cluster
          type: string
          jsonPath: .metadata.labels.cluster\.x-k8s\.io/cluster-name
        - name: Provisioned
          type: string
          jsonPath: .status.initialization.provisioned
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          properties:
            apiVersion: {type: string}
            kind: {type: string}
            metadata: {type: object}
            spec:
              type: object
            status:
              type: object
              properties:
                initialization:
                  type: object
                  properties:
                    provisioned: {type: boolean}
                conditions:
                  type: array
                  items:
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
