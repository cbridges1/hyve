---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: users.hyve.io
spec:
  group: hyve.io
  names:
    kind: User
    listKind: UserList
    plural: users
    singular: user
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.displayName
      name: Display Name
      type: string
    - jsonPath: .spec.disabled
      name: Disabled
      type: boolean
    - jsonPath: .status.lastLogin
      name: Last Login
      type: date
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          User is a hyve account.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              UserSpec is a person who signs in to hyve's host endpoint with a username
              and password (HYVE-PROPOSAL.md, "Signing in").
              metadata.name is the username. The password never lives here: its bcrypt
              hash is a Secret in the host's namespace, owned by this User, the way
              Rancher keeps local passwords in cattle-local-user-passwords — see
              internal/hostauth.
            properties:
              disabled:
                description: |-
                  Disabled users can't sign in, and their existing sessions stop
                  working.
                type: boolean
              displayName:
                description: DisplayName is shown in the UI and by `hyve user list`.
                type: string
              groups:
                description: |-
                  Groups the user belongs to. Kubernetes sees each one as
                  "hyve:<group>", alongside the user's own "hyve:<username>".
                items:
                  type: string
                type: array
              mustChangePassword:
                description: |-
                  MustChangePassword makes the next sign-in change the password before
                  it's given a session. Set on the bootstrap admin and by
                  `hyve user add` without --no-password-change.
                type: boolean
              provider:
                description: |-
                  Provider is "oidc" for a user who signs in through the identity
                  provider (and has no password); empty for a password user.
                type: string
              subject:
                description: |-
                  Subject is the identity provider's ID for the user (the ID token's
                  sub claim).
                type: string
              email:
                description: Email is the address the identity provider gave at the last sign-in.
                type: string
            type: object
          status:
            description: UserStatus is written by the host endpoint.
            properties:
              lastLogin:
                description: LastLogin is the time of the last successful sign-in.
                format: date-time
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
