# ImportedControlPlane: the Cluster API control plane of a cluster hyve
# didn't create ('hyve cluster import'). Nothing is provisioned: its
# Cluster's <name>-kubeconfig Secret reaches the cluster, and hyve-controller
# reports it initialized and available while the cluster answers, so Cluster
# API, CAAPF and hyve treat it like any other. Deleting it only detaches the
# cluster.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: importedcontrolplanes.hyve.io
  labels:
    # The Cluster API contract version this kind implements.
    cluster.x-k8s.io/v1beta2: v1alpha1
    clusterctl.cluster.x-k8s.io: ""
    clusterctl.cluster.x-k8s.io/move: ""
spec:
  group: hyve.io
  scope: Namespaced
  names:
    kind: ImportedControlPlane
    listKind: ImportedControlPlaneList
    plural: importedcontrolplanes
    singular: importedcontrolplane
    categories: [hyve, cluster-api]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Cluster
          type: string
          jsonPath: .metadata.labels.cluster\.x-k8s\.io/cluster-name
        - name: Endpoint
          type: string
          jsonPath: .spec.controlPlaneEndpoint.host
        - name: Version
          type: string
          jsonPath: .status.version
        - name: Available
          type: string
          jsonPath: .status.conditions[?(@.type=="Available")].status
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          properties:
            apiVersion: {type: string}
            kind: {type: string}
            metadata: {type: object}
            spec:
              type: object
              properties:
                controlPlaneEndpoint:
                  type: object
                  description: The cluster's API server, from its kubeconfig. Set by hyve-controller.
                  properties:
                    host: {type: string}
                    port: {type: integer, format: int32}
            status:
              type: object
              properties:
                initialization:
                  type: object
                  properties:
                    controlPlaneInitialized: {type: boolean}
                version:
                  type: string
                  description: The Kubernetes version the cluster reports.
                conditions:
                  type: array
                  items:
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
