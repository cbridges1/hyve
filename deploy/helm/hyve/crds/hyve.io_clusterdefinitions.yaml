---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: clusterdefinitions.hyve.io
spec:
  group: hyve.io
  names:
    kind: ClusterDefinition
    listKind: ClusterDefinitionList
    plural: clusterdefinitions
    shortNames:
    - cd
    singular: clusterdefinition
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.driver.source
      name: Driver
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          ClusterDefinition is the Schema for the clusterdefinitions API — the
          controller-mode source of truth for one cluster, equivalent to a
          clusters/<name>.yaml + cluster-state/<name>.state.yaml pair in file mode.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              ClusterDefinitionSpec is the desired state — the CRD equivalent of a
              human-authored clusters/<name>.yaml in file mode. Region lives here
              (rather than on ObjectMeta, which is reserved for Kubernetes' own
              bookkeeping) as the CRD-mode replacement for
              internal/types.ClusterMetadata.Region; the object's own metadata.name
              replaces internal/types.ClusterMetadata.Name.
            properties:
              access:
                description: |-
                  Access controls how a kubeconfig is minted for this cluster — see
                  HYVE-CONTROLLER-ARCHITECTURE-PLAN.md's Phase 6.5. Left unset (the
                  default), GET /api/kubeconfig doesn't serve this cluster at all: a
                  module's auth.yaml is written assuming it runs with the caller's own
                  local credentials/tools (cloud CLI configs, SSH keys, etc.), so the
                  API instead exposes driver info via
                  GET /api/clusters/<name>/auth-context and the CLI runs the module
                  client-side (see cmd/cluster/auth.go) — the same as local mode,
                  just sourcing the ClusterDefinition from the API instead of git.
                  Set Method: module-auth to override that and run the module
                  server-side instead, inside the API pod, on every /api/kubeconfig
                  request — only appropriate for a module whose auth.yaml is written
                  to run there and itself enforces proper authorization using the
                  caller identity hyve injects (HYVE_CALLER_USERNAME/HYVE_CALLER_ROLE
                  — see moduleEnvForClusterDefinition), since the pod's own ambient
                  credentials mint the result, not the caller's.
                properties:
                  method:
                    type: string
                  tunnel:
                    description: |-
                      TunnelSpec names which appendix pattern workflows/mint-tunnel-access.yaml
                      dispatches to for this cluster.
                    properties:
                      provider:
                        type: string
                    type: object
                type: object
              delete:
                description: |-
                  Delete marks this cluster for deletion — same semantics as file
                  mode's spec.delete:true. In CRD mode a `kubectl delete
                  clusterdefinition <name>` is the more natural trigger (see
                  ClusterDefinitionFinalizer); this field exists for parity and for
                  automated set-then-apply flows that mirror the file-mode pattern.
                type: boolean
              dependsOn:
                description: |-
                  DependsOn names other ClusterDefinitions this one depends on — see
                  HYVE-CONTROLLER-ARCHITECTURE-PLAN.md's "Optional dependsOn ordering"
                  section. ReconcileOne skips (does not fail) a reconcile cycle for
                  this cluster while any named dependency isn't ACTIVE.
                items:
                  type: string
                type: array
              driver:
                description: Driver identifies the module that manages this cluster.
                properties:
                  source:
                    type: string
                  version:
                    type: string
                type: object
              expiresAt:
                description: |-
                  ExpiresAt is an optional RFC 3339 timestamp. When the current time is
                  past this value the reconciler treats the cluster as if delete:true
                  is set.
                type: string
              params:
                additionalProperties:
                  type: string
                description: |-
                  Params are arbitrary key/value pairs passed to the driver as
                  HYVE_PARAM_<KEY> environment variables.
                type: object
              pause:
                description: |-
                  Pause skips reconciliation for this cluster while keeping its
                  definition in the cluster.
                type: boolean
              region:
                type: string
              resources:
                description: |-
                  Resources declares Kubernetes manifests hyve should own, drift-check,
                  and re-apply on every reconcile cycle for an ACTIVE cluster.
                items:
                  description: |-
                    ResourceRef declares one Kubernetes resource hyve should own, drift-check,
                    and re-apply on every reconcile cycle. Mirrors internal/types.ResourceRef.
                    Exactly one of Source, Helm, or Secret must be set.
                  properties:
                    delete:
                      type: boolean
                    helm:
                      description: |-
                        HelmSpec declares a Helm chart release to install/upgrade and drift-check.
                        Mirrors internal/types.HelmSpec.
                      properties:
                        chart:
                          type: string
                        namespace:
                          type: string
                        repo:
                          type: string
                        values:
                          additionalProperties:
                            type: string
                          type: object
                        version:
                          type: string
                      type: object
                    name:
                      type: string
                    namespace:
                      type: string
                    secret:
                      description: |-
                        SecretSpec declares a Kubernetes v1/Secret rendered from the controller's
                        own process environment at reconcile time. Mirrors internal/types.SecretSpec.
                      properties:
                        keys:
                          items:
                            description: |-
                              SecretKeyRef is one entry in SecretSpec.Keys — always the structured form
                              in the CRD (mirrors internal/types.SecretKeyRef's {env, key} mapping; that
                              type's bare-scalar shorthand is a YAML-only convenience, same caveat as
                              WorkflowRef above).
                            properties:
                              env:
                                type: string
                              key:
                                type: string
                            required:
                            - env
                            type: object
                          type: array
                        namespace:
                          type: string
                        type:
                          type: string
                      required:
                      - keys
                      type: object
                    source:
                      type: string
                  required:
                  - name
                  type: object
                type: array
              workflows:
                description: |-
                  WorkflowsSpec defines workflows to run on cluster lifecycle events.
                  Mirrors internal/types.WorkflowsSpec (minus the deprecated onDestroy
                  migration, which is a file-format compatibility concern that doesn't
                  apply to a CRD with no prior YAML history).
                properties:
                  afterCreate:
                    items:
                      description: |-
                        WorkflowRef identifies one workflow to run for a lifecycle hook.
                        Structured-only in the CRD form (unlike internal/types.WorkflowRef, which
                        also accepts a bare YAML scalar as shorthand for {name: "..."} in file
                        mode) — a CRD's spec goes through the Kubernetes API's standard JSON
                        decoding, which has no equivalent to that YAML-level custom-unmarshal
                        trick, so the local-name form must always be spelled out as {name: "..."}
                        here. Set exactly one of Name or Source.
                      properties:
                        name:
                          description: |-
                            Name is a local workflow name (workflows/<name>.yaml in the baked-in
                            modules dir). Mutually exclusive with Source.
                          type: string
                        path:
                          type: string
                        source:
                          description: |-
                            Source is a remote workflow ref ("github.com/org/repo//path@version").
                            Mutually exclusive with Name.
                          type: string
                      type: object
                    type: array
                  afterDelete:
                    items:
                      description: |-
                        WorkflowRef identifies one workflow to run for a lifecycle hook.
                        Structured-only in the CRD form (unlike internal/types.WorkflowRef, which
                        also accepts a bare YAML scalar as shorthand for {name: "..."} in file
                        mode) — a CRD's spec goes through the Kubernetes API's standard JSON
                        decoding, which has no equivalent to that YAML-level custom-unmarshal
                        trick, so the local-name form must always be spelled out as {name: "..."}
                        here. Set exactly one of Name or Source.
                      properties:
                        name:
                          description: |-
                            Name is a local workflow name (workflows/<name>.yaml in the baked-in
                            modules dir). Mutually exclusive with Source.
                          type: string
                        path:
                          type: string
                        source:
                          description: |-
                            Source is a remote workflow ref ("github.com/org/repo//path@version").
                            Mutually exclusive with Name.
                          type: string
                      type: object
                    type: array
                  beforeCreate:
                    items:
                      description: |-
                        WorkflowRef identifies one workflow to run for a lifecycle hook.
                        Structured-only in the CRD form (unlike internal/types.WorkflowRef, which
                        also accepts a bare YAML scalar as shorthand for {name: "..."} in file
                        mode) — a CRD's spec goes through the Kubernetes API's standard JSON
                        decoding, which has no equivalent to that YAML-level custom-unmarshal
                        trick, so the local-name form must always be spelled out as {name: "..."}
                        here. Set exactly one of Name or Source.
                      properties:
                        name:
                          description: |-
                            Name is a local workflow name (workflows/<name>.yaml in the baked-in
                            modules dir). Mutually exclusive with Source.
                          type: string
                        path:
                          type: string
                        source:
                          description: |-
                            Source is a remote workflow ref ("github.com/org/repo//path@version").
                            Mutually exclusive with Name.
                          type: string
                      type: object
                    type: array
                  onCreate:
                    items:
                      description: |-
                        WorkflowRef identifies one workflow to run for a lifecycle hook.
                        Structured-only in the CRD form (unlike internal/types.WorkflowRef, which
                        also accepts a bare YAML scalar as shorthand for {name: "..."} in file
                        mode) — a CRD's spec goes through the Kubernetes API's standard JSON
                        decoding, which has no equivalent to that YAML-level custom-unmarshal
                        trick, so the local-name form must always be spelled out as {name: "..."}
                        here. Set exactly one of Name or Source.
                      properties:
                        name:
                          description: |-
                            Name is a local workflow name (workflows/<name>.yaml in the baked-in
                            modules dir). Mutually exclusive with Source.
                          type: string
                        path:
                          type: string
                        source:
                          description: |-
                            Source is a remote workflow ref ("github.com/org/repo//path@version").
                            Mutually exclusive with Name.
                          type: string
                      type: object
                    type: array
                  onDelete:
                    items:
                      description: |-
                        WorkflowRef identifies one workflow to run for a lifecycle hook.
                        Structured-only in the CRD form (unlike internal/types.WorkflowRef, which
                        also accepts a bare YAML scalar as shorthand for {name: "..."} in file
                        mode) — a CRD's spec goes through the Kubernetes API's standard JSON
                        decoding, which has no equivalent to that YAML-level custom-unmarshal
                        trick, so the local-name form must always be spelled out as {name: "..."}
                        here. Set exactly one of Name or Source.
                      properties:
                        name:
                          description: |-
                            Name is a local workflow name (workflows/<name>.yaml in the baked-in
                            modules dir). Mutually exclusive with Source.
                          type: string
                        path:
                          type: string
                        source:
                          description: |-
                            Source is a remote workflow ref ("github.com/org/repo//path@version").
                            Mutually exclusive with Name.
                          type: string
                      type: object
                    type: array
                  preReconcile:
                    items:
                      description: |-
                        WorkflowRef identifies one workflow to run for a lifecycle hook.
                        Structured-only in the CRD form (unlike internal/types.WorkflowRef, which
                        also accepts a bare YAML scalar as shorthand for {name: "..."} in file
                        mode) — a CRD's spec goes through the Kubernetes API's standard JSON
                        decoding, which has no equivalent to that YAML-level custom-unmarshal
                        trick, so the local-name form must always be spelled out as {name: "..."}
                        here. Set exactly one of Name or Source.
                      properties:
                        name:
                          description: |-
                            Name is a local workflow name (workflows/<name>.yaml in the baked-in
                            modules dir). Mutually exclusive with Source.
                          type: string
                        path:
                          type: string
                        source:
                          description: |-
                            Source is a remote workflow ref ("github.com/org/repo//path@version").
                            Mutually exclusive with Name.
                          type: string
                      type: object
                    type: array
                type: object
            type: object
          status:
            description: |-
              ClusterDefinitionStatus is reconciler-owned observed state — the CRD
              equivalent of file mode's cluster-state/<name>.state.yaml sidecar, plus
              the two fields standard for any controller-runtime-managed resource
              (Conditions, ObservedGeneration). Written only via the status
              subresource: the reconciler never modifies .spec, treating it as
              external, user-owned input exactly like the Kubernetes convention for
              any other controller.
            properties:
              access:
                description: |-
                  Access records which access method is currently active for this
                  cluster — useful for GET /api/clusters to give an honest signal
                  about how a caller's kubeconfig request will be served.
                properties:
                  lastMinted:
                    description: |-
                      LastMinted is an RFC 3339 timestamp, set only for tunnel-mode
                      clusters (module-auth mints fresh on every request, so there's
                      nothing meaningful to record here for it).
                    type: string
                  method:
                    type: string
                type: object
              appliedResources:
                additionalProperties:
                  description: |-
                    AppliedResource is the reconciler-owned record of what hyve currently
                    believes it applied for one Resources entry. Mirrors
                    internal/types.AppliedResource.
                  properties:
                    appliedAt:
                      type: string
                    helm:
                      type: boolean
                    namespace:
                      type: string
                    objects:
                      items:
                        description: |-
                          AppliedObject is enough identity to `kubectl delete <kind> <name> [-n ns]`
                          later without needing the original manifest bytes. Mirrors
                          internal/types.AppliedObject.
                        properties:
                          apiVersion:
                            type: string
                          kind:
                            type: string
                          name:
                            type: string
                          namespace:
                            type: string
                        required:
                        - apiVersion
                        - kind
                        - name
                        type: object
                      type: array
                    sourceSHA256:
                      type: string
                  required:
                  - appliedAt
                  - sourceSHA256
                  type: object
                description: |-
                  AppliedResources is reconciler-owned state tracking what Resources
                  entries are currently applied, keyed by ResourceRef.Name.
                type: object
              conditions:
                description: |-
                  Conditions follow the standard Kubernetes Condition[] convention.
                  hyve sets "Ready" (True once the module reports ACTIVE),
                  "Reconciling" (True while a reconcile is in progress for this
                  generation), and "Error" (True with Message set when the last
                  reconcile attempt failed).
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              driverOutputs:
                additionalProperties:
                  type: string
                description: |-
                  DriverOutputs captures HYVE_* outputs produced by the driver's
                  create/status operations.
                type: object
              observedGeneration:
                description: |-
                  ObservedGeneration is the .metadata.generation last processed by the
                  controller — the standard controller-runtime pattern for a caller to
                  tell whether status reflects the most recent spec change.
                format: int64
                type: integer
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
