# hyve's chart: hyve-controller (templates, template resources, expiry)
# and, for installs without Rancher, hyve's host endpoint (sign-in and the
# /k8s/clusters proxy). See HYVE-PROPOSAL.md in nexus-config.

image:
  # Published with every hyve release. tag defaults to the chart's
  # appVersion, which the release sets to the same version as the image.
  repository: ghcr.io/cbridges1/hyve
  tag: ""
  pullPolicy: IfNotPresent

# Where hyve's own components run.
namespace: hyve-system

controller:
  enabled: true
  # The mutating webhook fills in Clusters labelled with a template, and
  # the validating one keeps locked variables locked. Without them,
  # templated Clusters must be complete when created (the CLI does that).
  webhook: true
  resources:
    requests:
      cpu: 20m
      memory: 64Mi
    limits:
      memory: 256Mi

# Rancher mode. hyve install sets enabled when it finds Rancher.
rancher:
  enabled: false
  # Make each cluster's creator its Cluster Owner once Turtles imports it,
  # as Rancher does for clusters it provisions. Rancher only lets someone
  # who holds every right of Cluster Owner grant it, so this binds
  # hyve-controller to cluster-admin on the management cluster, trusted
  # like Rancher's own controllers. Turn it off to grant owners by hand.
  creatorOwner: true

# hyve's UI. With Rancher, the extension (Cluster Templates, Clusters with
# their Resources tab, Create Cluster, Shared Resources) is installed into
# Rancher. Without Rancher, hyve's own UI is still to come.
ui:
  enabled: true
  # The extension's version (ui/pkg/hyve/package.json).
  version: "0.1.0"
  image:
    repository: ghcr.io/cbridges1/hyve-ui
    tag: ""
    pullPolicy: IfNotPresent

# host is hyve's host endpoint (`hyve host run`): username-and-password
# sign-in for installs without Rancher, and the management cluster's API at
# /k8s/clusters/local as the signed-in user (HYVE-PROPOSAL.md, "Signing
# in"). Off by default; never enable it alongside Rancher, which signs
# users in itself.
host:
  enabled: false
  replicaCount: 1
  # How long a sign-in lasts (Rancher's default is 16h).
  sessionTTL: 16h
  # Secret (in namespace) with the first admin's bootstrapPassword. If it
  # doesn't exist, the host generates one and logs how to read it.
  bootstrapSecret: bootstrap-secret
  # The host's address as child clusters reach it (https://...). Set, the
  # controller installs Rancher's cattle-cluster-agent on every cluster,
  # pointed here, and kubectl reaches clusters through it at
  # /k8s/clusters/<environment>.<name>.
  agentURL: ""
  # ConfigMap (in namespace) with key ca.crt: the CA the host's certificate
  # chains to, when it isn't publicly trusted. Agents pin its checksum.
  caCertsConfigMap: ""
  # The cattle-cluster-agent image hyve is tested against.
  agentImage: rancher/rancher-agent:v2.14.3
  service:
    type: ClusterIP
    port: 80
    # With type NodePort, a fixed node port (empty picks one).
    nodePort: ""
  # The host serves plain HTTP on 8080 for a TLS-terminating ingress or
  # reverse proxy in front (users sign in with passwords, so never expose it
  # without TLS). Set tlsSecret to a kubernetes.io/tls Secret to serve TLS
  # itself instead.
  tlsSecret: ""
  resources:
    requests:
      cpu: 20m
      memory: 48Mi
    limits:
      memory: 128Mi
