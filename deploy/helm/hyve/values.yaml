# hyve's chart: hyve-controller (templates, template resources, expiry)
# and hyve's host endpoint (sign-in, the agent tunnel, the /k8s/clusters
# proxy and the UI). See HYVE-PROPOSAL.md in nexus-config.

image:
  # Published with every hyve release. tag defaults to the chart's
  # appVersion, which the release sets to the same version as the image.
  repository: ghcr.io/cbridges1/hyve
  tag: ""
  pullPolicy: IfNotPresent

# Where hyve's own components run.
namespace: hyve-system

controller:
  enabled: true
  # The mutating webhook fills in Clusters labelled with a template, and
  # the validating one keeps locked variables locked. Without them,
  # templated Clusters must be complete when created (the CLI does that).
  webhook: true
  # Add known Cluster API providers (docker, kubeadm) the first time a
  # ClusterClass or a Fleet bundle needs their kinds. Installing providers
  # takes cluster-admin, which this grants the controller. Local mode turns
  # it on.
  lazyProviders: false
  resources:
    requests:
      cpu: 20m
      memory: 64Mi
    limits:
      memory: 256Mi

# How people sign in to the host (HYVE-PROPOSAL.md, "Signing in").
auth:
  # Username and password sign-in for hyve's own Users. Turn it off only
  # with oidc set: the bootstrap admin signs in with a password.
  passwords: true
  # Single sign-in through an OpenID Connect provider (Google, Keycloak,
  # Authentik, Okta, Entra ID, or GitHub through Dex). Set issuer to turn it
  # on; the provider's redirect URI is <host.agentURL>/v1-public/oidc/callback.
  oidc:
    issuer: ""
    clientID: ""
    # A Secret in namespace holding the client secret, and its key.
    clientSecret:
      name: ""
      key: client-secret
    # Shown as "Sign in with <displayName>".
    displayName: ""
    # Scopes besides openid (default profile and email).
    scopes: []
    groupsClaim: groups
    usernameClaim: preferred_username
    # Admit only verified emails in these domains, or users in these groups.
    allowedDomains: []
    allowedGroups: []

# hyve's UI: the host serves it at / (built into hyve's binary, so nothing
# more is installed); open it with `hyve ui`.
ui:
  enabled: true

# host is hyve's host endpoint (`hyve host run`): sign-in, and the
# management cluster's API at /k8s/clusters/local as the signed-in user
# (HYVE-PROPOSAL.md, "Signing in"). `hyve install --host-url` turns it on.
host:
  enabled: false
  replicaCount: 1
  # How long a sign-in lasts (Rancher's default is 16h).
  sessionTTL: 16h
  # One JSON line on the host's stdout per request it proxies to a cluster
  # as a user: who, which cluster, verb, path and status.
  auditLog: true
  # Secret (in namespace) with the first admin's bootstrapPassword. If it
  # doesn't exist, the host generates one and logs how to read it.
  bootstrapSecret: bootstrap-secret
  # Local mode only: browsers at 127.0.0.1 or localhost are signed in as
  # this user without a password. Never set it on a host others can reach.
  localUser: ""
  # The host's address as child clusters reach it (https://...). Set, the
  # controller installs Rancher's cattle-cluster-agent on every cluster,
  # pointed here, and kubectl reaches clusters through it at
  # /k8s/clusters/<environment>.<name>.
  agentURL: ""
  # ConfigMap (in namespace) with key ca.crt: the CA the host's certificate
  # chains to, when it isn't publicly trusted. Agents pin its checksum.
  caCertsConfigMap: ""
  # The cattle-cluster-agent image hyve is tested against.
  agentImage: rancher/rancher-agent:v2.14.3
  service:
    type: ClusterIP
    port: 80
    # With type NodePort, a fixed node port (empty picks one).
    nodePort: ""
  # The host serves plain HTTP on 8080 for a TLS-terminating ingress or
  # reverse proxy in front (users sign in with passwords, so never expose it
  # without TLS). Set tlsSecret to a kubernetes.io/tls Secret to serve TLS
  # itself instead.
  tlsSecret: ""
  resources:
    requests:
      cpu: 20m
      memory: 48Mi
    limits:
      memory: 128Mi
