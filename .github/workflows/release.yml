name: Release

on:
  push:
    tags:
      - "v*"

  workflow_dispatch:
    inputs:
      snapshot:
        description: "Snapshot mode — build everything (binaries, archives, Docker images, Helm chart, Homebrew formula) but publish nothing. Safe to run anytime, on any branch, with or without a tag, to test the pipeline itself."
        type: boolean
        default: true

permissions:
  contents: write   # create the GitHub Release and upload artifacts
  packages: write   # push images and the Helm chart to ghcr.io

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history/tags — GoReleaser needs this for the changelog

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # GoReleaser's before hooks build the web console (web/) that gets
      # embedded into the binary — see .goreleaser.yaml.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set args (snapshot — nothing published)
        id: snapshot_args
        if: github.event_name == 'workflow_dispatch' && inputs.snapshot
        run: echo "value=release --snapshot --clean --skip=publish" >> "$GITHUB_OUTPUT"

      - name: Set args (real release)
        id: release_args
        if: github.event_name != 'workflow_dispatch' || inputs.snapshot == false
        run: echo "value=release --clean" >> "$GITHUB_OUTPUT"

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: ${{ steps.snapshot_args.outputs.value || steps.release_args.outputs.value }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Needs `contents: write` on the separate cbridges1/homebrew-tap
          # repository — GITHUB_TOKEN is scoped to this repo only, so a
          # fine-grained PAT (or classic PAT with `repo` scope) is required.
          # Create it under Settings → Secrets and variables → Actions.
          # Not needed in snapshot mode (nothing is pushed), so this workflow
          # runs fine even before that secret/repo exist yet.
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}

      # The chart's version and appVersion are both the release version, so
      # image.tag's default (appVersion) is the image GoReleaser just pushed.
      # Published as an OCI artifact:
      #   helm install hyve oci://ghcr.io/cbridges1/charts/hyve --version <version>
      - name: Package Helm chart
        id: chart
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.snapshot }}" = "true" ]; then
            VERSION="0.0.0-snapshot.${GITHUB_SHA::7}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          helm lint deploy/helm/hyve
          helm package deploy/helm/hyve --version "$VERSION" --app-version "$VERSION" --destination dist/chart
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Publish Helm chart
        if: github.event_name != 'workflow_dispatch' || inputs.snapshot == false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GITHUB_TOKEN" | helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin
          helm push "dist/chart/hyve-${{ steps.chart.outputs.version }}.tgz" oci://ghcr.io/cbridges1/charts
          gh release upload "$GITHUB_REF_NAME" "dist/chart/hyve-${{ steps.chart.outputs.version }}.tgz" --clobber

      - name: Upload snapshot artifacts
        if: github.event_name == 'workflow_dispatch' && inputs.snapshot
        uses: actions/upload-artifact@v4
        with:
          name: snapshot-dist
          path: dist/*
          retention-days: 7
