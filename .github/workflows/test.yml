name: Tests

on:
  pull_request:
    branches: [main]

  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race -cover ./... -json > report.json

      - name: Report
        uses: becheran/go-testreport@main
        with:
          input: report.json

  chart:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Lint
        run: helm lint deploy/helm/hyve

      - name: Render (defaults, and with the host endpoint)
        run: |
          helm template hyve deploy/helm/hyve --include-crds > /dev/null
          helm template hyve deploy/helm/hyve --set host.enabled=true \
            | grep -q 'name: hyve-host'

  # hyve's host endpoint against the pinned rancher/rancher-agent; also
  # how a new agent version is tested before the pin moves.
  agent:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install k3d
        run: curl -s https://raw.githubusercontent.com/k3d-io/k3d/v5.8.3/install.sh | TAG=v5.8.3 bash

      - name: Agent test
        run: hack/e2e-agent.sh
