version: "3"

vars:
  BINARY: hyve
  EXT: '{{if eq OS "windows"}}.exe{{end}}'
  BUILD_FLAGS: ""

tasks:
  default:
    desc: List available tasks
    cmd: task --list

  build:
    desc: Build the hyve binary
    cmd: go build {{.BUILD_FLAGS}} -o {{.BINARY}}{{.EXT}} .

  run:
    desc: Build and run hyve (pass args with -- e.g. task run -- cluster list)
    deps: [build]
    cmds:
      - cmd: .\{{.BINARY}}{{.EXT}} {{.CLI_ARGS}}
        platforms: [windows]
      - cmd: ./{{.BINARY}}{{.EXT}} {{.CLI_ARGS}}
        platforms: [linux, darwin]

  dev:
    desc: Run with go run main.go
    cmd: go run main.go {{.CLI_ARGS}}

  test:
    desc: Run all tests
    cmd: go test ./...

  test:verbose:
    desc: Run all tests with verbose output
    cmd: go test -v ./...

  test:race:
    desc: Run all tests with race detector
    cmd: go test -race ./...

  test:cover:
    desc: Run all tests with coverage report
    cmd: go test -cover ./...

  test:report:
    desc: Run tests and generate JSON report
    cmd: go test -race -cover ./... -json > report.json

  vet:
    desc: Run go vet
    cmd: go vet ./...

  tidy:
    desc: Tidy go modules
    cmd: go mod tidy

  clean:
    desc: Remove built binary and report artifacts
    cmds:
      - cmd: del /f "{{.BINARY}}{{.EXT}}" report.json coverage.out 2>nul & exit /b 0
        platforms: [windows]
      - cmd: rm -f {{.BINARY}}{{.EXT}} report.json coverage.out
        platforms: [linux, darwin]

  check:
    desc: Run vet and tests
    deps: [vet, test]

  test:concurrency:
    desc: Live smoke test proving --max-concurrent-reconciles is safe (needs a working kubectl context + reachable cluster; installs/removes hyve's CRDs and a scratch namespace)
    cmds:
      - cmd: bash ./scripts/test-concurrency.sh {{.CLI_ARGS}}
        platforms: [linux, darwin]
      - cmd: echo "test:concurrency needs bash — run scripts/test-concurrency.sh via WSL or Git Bash on Windows"
        platforms: [windows]

  test:secretsfrom:
    desc: Live smoke test for Phase 5's runtime:client workflows + secretsFrom (needs a working kubectl context + reachable cluster; fully isolated via a scratch HYVE_HOME, plus a scratch namespace it removes on exit)
    cmds:
      - cmd: bash ./scripts/test-secretsfrom.sh
        platforms: [linux, darwin]
      - cmd: echo "test:secretsfrom needs bash — run scripts/test-secretsfrom.sh via WSL or Git Bash on Windows"
        platforms: [windows]

  test:api:
    desc: Live smoke test for Phase 6's API + auth layer — login, authn/authz, cluster CRUD, module-auth kubeconfig (needs kubectl + reachable cluster + curl/jq/openssl; runs the API as a local process, primary-cluster/proxy paths need a real in-cluster deployment and aren't covered here)
    cmds:
      - cmd: bash ./scripts/test-api.sh
        platforms: [linux, darwin]
      - cmd: echo "test:api needs bash — run scripts/test-api.sh via WSL or Git Bash on Windows"
        platforms: [windows]

  cluster:local:
    desc: Create (idempotently) a standalone k3d cluster for local hyve dev, with host 80/443 mapped to k3d's Traefik ingress — run this once before install:local. Sets your kubectl context to it. Needs k3d.
    cmds:
      - cmd: bash ./scripts/create-local-cluster.sh {{.CLI_ARGS}}
        platforms: [linux, darwin]
      - cmd: echo "cluster:local needs bash — run scripts/create-local-cluster.sh via WSL or Git Bash on Windows"
        platforms: [windows]

  install:local:
    desc: Build hyve from local source and install controller + API onto whatever cluster your kubectl context points at — run `task cluster:local` first. Exposes the API via Ingress (hyve-api.localhost), no port-forward needed. Persistent, not a self-cleaning smoke test. Needs docker/kubectl/helm/openssl.
    cmds:
      - cmd: bash ./scripts/install-local.sh {{.CLI_ARGS}}
        platforms: [linux, darwin]
      - cmd: echo "install:local needs bash — run scripts/install-local.sh via WSL or Git Bash on Windows"
        platforms: [windows]
